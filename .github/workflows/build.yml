name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip kalaram_aaa_android_project.zip
      - name: Fix gradle config
        working-directory: kalaram_aaa_android_project
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KalaramMandirAAA"
          include ':app'
          EOF
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n" > gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
        working-directory: kalaram_aaa_android_project
      - uses: actions/upload-artifact@v4
        with:
          name: kalaram-mandir-apk
          path: kalaram_aaa_android_project/app/build/outputs/apk/debug/app-debug.apk
