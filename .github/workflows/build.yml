name: Panchvati 
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip panchavati_android_project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
        working-directory: panchavati_android_project
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: panchavati_android_project/app/build/outputs/apk/debug/app-debug.apk
